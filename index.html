<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML CSS JS ตัวอย่าง</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f8ff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            text-align: center;
            background-color: #fff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #2c3e50;
        }

        #greeting {
            font-size: 1.2em;
            color: #7f8c8d;
            margin-bottom: 20px;
        }

        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1em;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #2980b9;
        }
    </style>

</head>
<body>

    <div class="container">
        <h1>หน้าเว็บง่ายๆ</h1>
        <p id="greeting">สวัสดีครับ! กดปุ่มข้างล่างเพื่อเปลี่ยนข้อความ</p>
        <button id="changeTextBtn">เปลี่ยนข้อความ</button>
    </div>

    <script>
        // ค้นหาปุ่มและข้อความจาก HTML โดยใช้ ID
        const button = document.getElementById('changeTextBtn');
        const greetingParagraph = document.getElementById('greeting');

        // กำหนดข้อความที่จะใช้เปลี่ยน
        const messages = [
            'ยินดีต้อนรับสู่โลกของ JavaScript!',
            'การเขียนโค้ดไม่ยากอย่างที่คิด!',
            'คุณทำได้แน่นอน!',
            'มาสร้างเว็บไซต์สนุกๆ กันเถอะ!'
        ];

        // เพิ่มตัวแปรสำหรับนับจำนวนครั้งที่กดปุ่ม
        let clickCount = 0;

        // กำหนดการทำงานเมื่อผู้ใช้กดปุ่ม
        button.addEventListener('click', function() {
            // เปลี่ยนข้อความในย่อหน้า (paragraph)
            // ใช้ตัวดำเนินการ modulo (%) เพื่อวนลูปข้อความ
            greetingParagraph.textContent = messages[clickCount % messages.length];

            // เพิ่มค่า clickCount เพื่อใช้ในครั้งต่อไป
            clickCount++;
        });
    </script>

</body>
</html>
